schema_version: "1.0"

extension:
  id: "patchwarden-evidence"
  name: "PatchWarden Evidence Pack"
  version: "1.0.1"
  description: "Map Spec Kit tasks into a guarded PatchWarden Goal and export bounded, traceable evidence for an accepted lineage."
  author: "Zengjie"
  repository: "https://github.com/jiezeng2004-design/spec-kit-patchwarden"
  homepage: "https://github.com/jiezeng2004-design/spec-kit-patchwarden"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.patchwarden-evidence.prepare-evidence"
      file: "commands/prepare-evidence.md"
      description: "Create a guarded PatchWarden Goal and import the current Spec Kit tasks as subgoals."
    - name: "speckit.patchwarden-evidence.export-evidence"
      file: "commands/export-evidence.md"
      description: "Export and summarize a PatchWarden evidence pack for an accepted lineage."

hooks:
  before_implement:
    command: "speckit.patchwarden-evidence.prepare-evidence"
    priority: 20
    optional: true
    prompt: "Map this Spec Kit scope into a guarded PatchWarden Goal?"
    description: "Optionally creates a Goal and imports approved Spec Kit tasks without executing implementation work."
  after_implement:
    command: "speckit.patchwarden-evidence.export-evidence"
    priority: 20
    optional: true
    prompt: "Export a PatchWarden evidence pack after this implementation?"
    description: "Optionally exports bounded evidence for a completed PatchWarden lineage."

tags:
  - "verification"
  - "evidence"
  - "traceability"
  - "security"
